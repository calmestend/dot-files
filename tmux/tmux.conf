# Keep the current directory
unbind C-b

set -g prefix C-f

set -g default-terminal "tmux-256color"

bind C-f send-prefix

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# kanagawa theme
# See: https://github.com/obergodmar/kanagawa-tmux/blob/master/kanagawa.tmux
set -g status "on"
set -g status-bg "terminal"
set -g status-justify "left"
set -g status-left-length "50"
set -g status-right-length "150"
 
set -g message-style "fg=orange,bg=default,align=centre"
set -g message-command-style "fg=orange,bg=default,align=centre"
 
set -g pane-border-style "fg=default"
set -g pane-active-border-style "fg=blue"
 
setw -g window-status-activity-style "fg=terminal,bg=terminal,none"
setw -g window-status-separator ""
setw -g window-status-style "fg=terminal,bg=terminal,none"
 
setw -g clock-mode-colour "blue"
setw -g mode-style "fg=orange bg=default bold"
 
set -g status-left ""
set -g status-right '#[fg=green,bg=default]  #{pane_current_path} #{?#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD),#[fg=terminal]on #[fg=magenta] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD),} #{?client_prefix,#[fg=orange],#[fg=terminal]}#[bg=default]  #S  #[fg=terminal,bg=default] 󱩊 #(whoami)@#H  #[fg=orange,bg=default]  %H:%M '
 
setw -g window-status-format "#[fg=terminal,bg=terminal,italics] #I: #W "
setw -g window-status-current-format "#[fg=terminal,bg=default,underscore] #I: #W "

